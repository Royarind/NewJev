[project]
name = "newjev"
version = "0.2.0"
description = "Computer Use Agent powered by Jev decision model — no vision LLM required."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "anthropic>=0.40",
    "playwright>=1.48",
    "rich>=13",
    "pywinauto>=0.6",
    "uiautomation>=2.0",
    "pillow>=10",
    "aiofiles>=23",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "openpyxl>=3.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]

[project.scripts]
newjev = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
